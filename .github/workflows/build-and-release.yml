name: Build and Release

# Acionado pelo repositório FOOBIZ (repository_dispatch) quando uma tag
# v* é publicada lá. Baixa os 3 builds do frontend (pdv/kds/totem, cada um
# uma SPA independente desde a separação de apps), gera os 3 instaladores
# Windows e publica a release no GitHub.
on:
  repository_dispatch:
    types: [build-desktop]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: v1.4.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Download frontend dist (pdv, kds, totem — um zip por app)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FOOBIZ_READ_TOKEN }}
        run: |
          gh release download "$VERSION" \
            --repo solubiztecnologia/FOOBIZ \
            --pattern "*-dist.zip"

          mkdir -p frontend/pdv-dist frontend/kds-dist frontend/totem-dist
          unzip -o pdv-dist.zip -d frontend/pdv-dist
          unzip -o kds-dist.zip -d frontend/kds-dist
          unzip -o totem-dist.zip -d frontend/totem-dist

      - name: Set version
        shell: bash
        run: npm version "${VERSION#v}" --no-git-tag-version

      - name: Delete existing release/draft for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$VERSION" --repo paulo724/foobiz-desktop --yes --cleanup-tag || true

      - name: Create draft release (single, shared by the 3 builds)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --repo paulo724/foobiz-desktop \
            --title "$VERSION" \
            --notes "Build automático — PDV, KDS, Totem." \
            --draft

      - name: Build and publish PDV
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf frontend/dist
          cp -r frontend/pdv-dist frontend/dist
          npm run build:pdv -- --publish always

      - name: Build and publish KDS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf frontend/dist
          cp -r frontend/kds-dist frontend/dist
          npm run build:kds -- --publish always

      - name: Build and publish Totem
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf frontend/dist
          cp -r frontend/totem-dist frontend/dist
          npm run build:totem -- --publish always
