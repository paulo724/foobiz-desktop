<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Foobiz</title>
<style>
  :root {
    color-scheme: dark;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-app-region: drag;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    border-radius: 16px;
    background:
      radial-gradient(120% 140% at 50% -10%, #253247 0%, #161d29 45%, #10151e 100%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    opacity: 0;
    animation: stage-in 0.5s ease-out forwards;
    overflow: hidden;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(227, 30, 36, 0.10), transparent 40%);
    pointer-events: none;
  }

  body.leaving .stage {
    animation: stage-out 0.35s ease-in forwards;
  }

  @keyframes stage-in {
    from { opacity: 0; transform: scale(0.985); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes stage-out {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(1.01); }
  }

  .logo-wrap {
    position: relative;
    width: 108px;
    height: 108px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-wrap img {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    object-fit: cover;
    box-shadow: 0 10px 30px rgba(227, 30, 36, 0.25);
    animation: logo-pulse 2.2s ease-in-out infinite;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #e31e24;
    border-right-color: rgba(227, 30, 36, 0.35);
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes logo-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #f4f5f7;
  }

  .brand-name span {
    color: #e31e24;
  }

  .app-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #8a94a6;
  }

  .status {
    position: absolute;
    bottom: 30px;
    font-size: 11.5px;
    color: #5c6577;
    letter-spacing: 0.3px;
    opacity: 0;
    animation: status-in 0.5s ease-out 0.6s forwards;
  }

  @keyframes status-in {
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="logo-wrap">
      <div class="ring"></div>
      <img id="app-icon" src="" alt="" />
    </div>
    <div class="brand">
      <div class="brand-name">foo<span>biz</span></div>
      <div class="app-label" id="app-label">Carregando</div>
    </div>
    <div class="status" id="status">Iniciando…</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search)
    const label = params.get('label') || ''
    const icon = params.get('icon') || ''

    if (label) document.getElementById('app-label').textContent = label
    if (icon) document.getElementById('app-icon').src = icon

    window.finishSplash = () => {
      document.body.classList.add('leaving')
    }
  </script>
</body>
</html>
